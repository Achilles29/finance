Kerjakan fix dan penyempurnaan kecil-terarah berdasarkan temuan finance_auditor, dokumen audit,
roadmap komersialisasi, hasil scan kode, dan kebutuhan readiness siap jual.
Jaga pola CodeIgniter/PHP yang sudah ada.
Fokus awal pada security, RBAC, integritas transaksi, stok/lot/HPP/defisit, POS web/mobile,
order online/member, produksi/resep/formula/bundle, finance, attendance, payroll, asset, printer,
migration/seed/updater, dependency, release packaging, konfigurasi identitas customer, dan automated test.
Jangan menghapus backup, upload customer, credential, atau file runtime kecuali main agent secara eksplisit meminta.
Hindari edit besar tanpa batch yang jelas. Selesaikan satu batch, validasi, lalu minta review finance_auditor.
Setiap selesai fix, jalankan validasi yang masuk akal: php -l, composer validate, test/manual probe lokal,
atau query audit jika tersedia dan relevan.
Catat file berubah, alasan perubahan, validasi, risiko sisa, dan rekomendasi batch berikutnya.
"""
